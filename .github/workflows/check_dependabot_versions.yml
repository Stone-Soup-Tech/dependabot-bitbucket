name: "Check Dependabot CLI versions"
on:
  schedule:
    # Every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  check_versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Check for new Dependabot CLI versions
        run: python3 scripts/cli_release.py --update

      - name: Read Dependabot CLI version
        id: dependabot_version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("versions.yml"))["cli_version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run runner and release tooling tests
        run: python3 -B -m unittest discover -p 'test_*.py'

      - name: Validate proposed image before opening PR
        run: docker build -f sdk/Dockerfile -t dependabot-bitbucket:update .

      # The action creates or updates a PR only when there are changes.
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: versions.yml
          commit-message: "chore: Update Dependabot CLI to ${{ steps.dependabot_version.outputs.version }}"
          title: "chore: Update Dependabot CLI to ${{ steps.dependabot_version.outputs.version }}"
          body: 'Updates the upstream CLI version, verified archive SHA256 and runner image patch version. Tests and image build run before PR creation. Approve pending PR workflows and review their results before merging.'
          branch: "chore/update-dependabot-cli"
          reviewers: mihaiborcansst

