name: Publish Dependabot image
on:
  push:
    branches: [main]
    paths:
      - dependabot.py
      - sdk/**
      - scripts/**
      - versions.yml
      - .github/workflows/ci.yml
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-dependabot
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Read image version and repository
        id: image
        run: |
          version=$(python3 -c 'import json; print(json.load(open("versions.yml"))["image_version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image="ghcr.io/stone-soup-tech/dependabot-bitbucket"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the release image is already published
        id: release
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          if output=$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1); then
            echo "::notice::Image $IMAGE:$VERSION is already published. No image will be published; existing release tags and latest remain unchanged. To publish new changes, increment image_version in versions.yml."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -Eiq 'manifest unknown|not found|no such manifest' <<< "$output"; then
            echo '::error::Could not establish whether the image exists. Refusing publication.'
            exit 1
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.release.outputs.should_publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: sdk
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
